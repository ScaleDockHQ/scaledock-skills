version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 2
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 2
    groups:
      github-actions:
        patterns: ["*"]
