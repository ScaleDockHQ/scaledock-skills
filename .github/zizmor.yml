rules:
  unpinned-uses:
    config:
      policies:
        # The standard keeps GitHub-owned actions on their latest major tag; everything else is SHA-pinned.
        "actions/*": ref-pin
        "github/*": ref-pin
        "*": hash-pin
  dependabot-cooldown:
    config:
      # Matches cooldown.default-days in dependabot.yml, which the standard sets to 2.
      days: 2
