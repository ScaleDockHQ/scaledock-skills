name: Setup
description: Install pnpm, the Node version from .node-version, and the locked dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
      with:
        node-version-file: .node-version
        cache: true
        require-lockfile: true
