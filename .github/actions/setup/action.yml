name: Setup
description: Install pnpm, the Node version from .node-version, and the locked dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        node-version-file: .node-version
        cache: true
        require-lockfile: true
