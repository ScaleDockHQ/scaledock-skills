name: Setup
description: Install pnpm, the Node version from .node-version, and the locked dependencies.

inputs:
  save-cache:
    description: Save the pnpm store after the job. Only the default branch saves it; other runs restore that entry.
    default: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

runs:
  using: composite
  steps:
    - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        node-version-file: .node-version
        cache: true
        save-cache: ${{ inputs.save-cache }}
        require-lockfile: true
